      /**
       * Safeguard window.fetch against read-only getter restrictions
       * Prevents "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
       */
      (function () {
        try {
          var nativeFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = nativeFetch;

          function installFetchAccessor(target) {
            if (!target) return false;
            try {
              var descriptor = Object.getOwnPropertyDescriptor(target, 'fetch');
              // If property exists with a getter and no setter, provide a setter
              if (descriptor && descriptor.get && !descriptor.set) {
                Object.defineProperty(target, 'fetch', {
                  get: function () {
                    return _currentFetch;
                  },
                  set: function (newFetch) {
                    _currentFetch = newFetch;
                  },
                  configurable: true,
                  enumerable: true,
                });
                return true;
              }
            } catch (err) {
              // Ignore restriction
            }
            return false;
          }

          if (!installFetchAccessor(window)) {
            var proto = typeof window !== 'undefined' ? Object.getPrototypeOf(window) : null;
            while (proto && proto !== Object.prototype) {
              if (installFetchAccessor(proto)) break;
              proto = Object.getPrototypeOf(proto);
            }
          }

          // In case another script executes in strict mode before redefinition
          window.addEventListener('error', function (event) {
            if (
              event &&
              event.message &&
              event.message.indexOf('fetch') !== -1 &&
              event.message.indexOf('only a getter') !== -1
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          });
        } catch (e) {
          // Ignore
        }
      })();
